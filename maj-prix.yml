name: Mettre à jour les prix

on:
  schedule:
    - cron: "30 22 * * 1-5"   # chaque soir de semaine, après la fermeture des marchés
  workflow_dispatch:           # permet de la lancer à la main

permissions:
  contents: write

jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python telecharger_prix.py
        working-directory: suivi-portefeuille
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add suivi-portefeuille/prix.json
          git diff --staged --quiet || (git commit -m "Mise à jour des prix" && git push)
